<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>データサイエンティスト スキルチェックリスト</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root { --navbar-h: 52px; --sidebar-w: 200px; }

    body { padding-top: var(--navbar-h); }

    /* ── layout ── */
    #layout {
      display: flex;
      min-height: calc(100vh - var(--navbar-h));
    }

    /* ── sidebar ── */
    #sidebar {
      width: var(--sidebar-w);
      flex-shrink: 0;
      position: sticky;
      top: var(--navbar-h);
      height: calc(100vh - var(--navbar-h));
      overflow-y: auto;
      background: #f8f9fa;
      border-right: 1px solid #dee2e6;
      padding: 12px 0;
    }
    #sidebar .nav-link {
      color: #495057;
      font-size: 0.85rem;
      padding: 6px 16px;
      border-left: 3px solid transparent;
      white-space: normal;
      line-height: 1.3;
    }
    #sidebar .nav-link:hover { background: #e9ecef; }
    #sidebar .nav-link.active {
      color: #0d6efd;
      font-weight: 600;
      border-left-color: #0d6efd;
      background: #e7f3ff;
    }
    #sidebar-title {
      font-size: 0.72rem;
      font-weight: 600;
      color: #6c757d;
      text-transform: uppercase;
      padding: 0 16px 8px;
      letter-spacing: 0.05em;
    }

    /* ── main content ── */
    #main { flex: 1; min-width: 0; }

    /* ── sticky toolbar ── */
    #toolbar {
      position: sticky;
      top: var(--navbar-h);
      z-index: 800;
      background: #fff;
      border-bottom: 1px solid #dee2e6;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    #search { flex: 1 1 200px; max-width: 360px; }
    #search-count { font-size: 0.8rem; color: #6c757d; white-space: nowrap; }

    /* ── section headers ── */
    .section-toggle {
      width: 100%;
      text-align: left;
      background: #343a40;
      color: #fff;
      border: none;
      padding: 10px 16px;
      font-size: 0.95rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      border-radius: 4px;
    }
    .section-toggle:hover { background: #495057; }
    .section-toggle .chevron { transition: transform 0.2s; font-size: 0.7rem; }
    .section-toggle.collapsed .chevron { transform: rotate(-90deg); }

    /* ── skill tables ── */
    .skill-table { font-size: 0.85rem; margin-bottom: 0; }
    .skill-table thead th { background: #f8f9fa; white-space: nowrap; }
    .skill-table td { vertical-align: middle; }

    .skill-level { color: #e6a817; font-weight: bold; white-space: nowrap; }

    .phase-header {
      background: #6c757d;
      color: #fff;
      padding: 5px 12px;
      border-radius: 4px;
      font-size: 0.85rem;
      margin-top: 12px;
    }
    .super-group-header {
      background: #e9ecef;
      padding: 4px 12px;
      border-radius: 4px;
      font-size: 0.82rem;
      color: #495057;
      font-weight: 600;
      margin-top: 8px;
    }

    .accordion-button { font-size: 0.88rem; }
    .accordion-button:not(.collapsed) { background-color: #e7f3ff; }

    .badge-bz  { background-color: #fd7e14; }
    .badge-ds  { background-color: #0d6efd; }
    .badge-de  { background-color: #198754; }
    .badge-vc  { background-color: #6f42c1; }
    .badge-req { background-color: #dc3545; }

    .skill-row.hidden    { display: none; }
    .accordion-item.hidden { display: none; }
    .section-block.hidden  { display: none; }

    /* ── mobile ── */
    @media (max-width: 768px) {
      :root { --sidebar-w: 0px; }
      #sidebar { display: none; }
    }
  </style>
</head>
<body>

  <nav class="navbar navbar-dark bg-dark fixed-top">
    <div class="container-fluid">
      <span class="navbar-brand fw-bold" style="font-size:0.92rem;">
        データサイエンティスト スキルチェックリスト
      </span>
    </div>
  </nav>

  <div id="layout">

    <!-- ── Sidebar ── -->
    <nav id="sidebar">
      <div id="sidebar-title">セクション</div>
      <ul class="nav flex-column" id="sidebar-nav"></ul>
    </nav>

    <!-- ── Main ── -->
    <div id="main">
      <div id="toolbar">
        <input type="search" class="form-control form-control-sm" id="search" placeholder="🔍 全セクション横断検索...">
        <span id="search-count"></span>
        <div class="d-flex gap-1 ms-auto">
          <button class="btn btn-sm btn-primary"          id="btn-expand">全て展開</button>
          <button class="btn btn-sm btn-outline-secondary" id="btn-collapse">全て折りたたむ</button>
          <button class="btn btn-sm btn-outline-secondary" id="btn-reset">リセット</button>
        </div>
      </div>

      <div class="p-3">
        <p class="text-muted small mb-3">
          スキルチェックリストの詳細は
          <a href="https://speakerdeck.com/datascientistsociety/12thsymp_skill" target="_blank" rel="noopener">こちら</a>
        </p>

        <div id="sections"></div>

        <div class="mt-5 text-muted small border-top pt-3">
          <strong>引用・改変時の注意事項</strong>
          <ul class="mt-1">
            <li>チェックリストを引用される場合「一般社団法人データサイエンティスト協会 スキルチェックリストより引用」と引用元を明示願います。</li>
            <li>チェックリストを改変された場合「一般社団法人データサイエンティスト協会 スキルチェックリストを改変」と改変した旨、明示願います。</li>
          </ul>
        </div>
      </div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="environment/environment.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
