<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>データサイエンティスト スキルチェックリスト</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link href="assets/css/app.css" rel="stylesheet">
</head>
<body>

  <nav class="navbar navbar-dark bg-dark fixed-top">
    <div class="container-fluid">
      <span class="navbar-brand fw-bold" style="font-size:0.92rem;">
        データサイエンティスト スキルチェックリスト
      </span>
    </div>
  </nav>

  <div id="layout">

    <!-- ── Sidebar ── -->
    <nav id="sidebar">
      <div id="sidebar-title">セクション</div>
      <ul class="nav flex-column" id="sidebar-nav"></ul>
    </nav>

    <!-- ── Main ── -->
    <div id="main">
      <div id="toolbar">
        <input type="search" class="form-control form-control-sm" id="search" placeholder="🔍 全セクション横断検索..." aria-label="全セクション横断検索">
        <span id="search-count"></span>
        <div class="d-flex gap-1 ms-auto">
          <button class="btn btn-sm btn-primary"          id="btn-expand">全て展開</button>
          <button class="btn btn-sm btn-outline-secondary" id="btn-collapse">全て折りたたむ</button>
          <button class="btn btn-sm btn-outline-secondary" id="btn-reset">リセット</button>
        </div>
      </div>

      <div class="p-3">
        <p class="text-muted small mb-3">
          スキルチェックリストの詳細は
          <a href="https://speakerdeck.com/datascientistsociety/12thsymp_skill" target="_blank" rel="noopener">こちら</a>
        </p>

        <div id="sections"></div>

        <div class="mt-5 text-muted small border-top pt-3">
          <strong>引用・改変時の注意事項</strong>
          <ul class="mt-1">
            <li>チェックリストを引用される場合「一般社団法人データサイエンティスト協会 スキルチェックリストより引用」と引用元を明示願います。</li>
            <li>チェックリストを改変された場合「一般社団法人データサイエンティスト協会 スキルチェックリストを改変」と改変した旨、明示願います。</li>
          </ul>
        </div>
      </div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  <script src="environment/environment.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
